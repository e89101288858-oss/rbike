{% extends 'base.html' %}
{% block content %}
<h2>Велосипеды</h2>
<form method="post" class="form-grid">
  <input name="serial_number" placeholder="Серийный номер" required>
  <input name="model_name" placeholder="Модель" required>
  <input name="price_per_hour" type="number" min="0" step="0.01" placeholder="Цена/час" required>
  <button type="submit">Добавить</button>
</form>
<table>
  <tr><th>ID</th><th>Серийный №</th><th>Модель</th><th>Цена/час</th><th>Статус</th></tr>
  {% for bike in bikes %}
  <tr>
    <td>{{ bike.id }}</td><td>{{ bike.serial_number }}</td><td>{{ bike.model_name }}</td>
    <td>{{ bike.price_per_hour }}</td><td>{{ 'доступен' if bike.is_available else 'занят' }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
